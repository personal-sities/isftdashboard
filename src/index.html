udyCampus',d.studyChart.categories,d.studyChart.series,true,320);if(hasCourseStudentChart)bar('lmsCourseDirectionStudents',d.courseDirectionStudentChart.categories,d.courseDirectionStudentChart.series,true,340);if(hasCoursePaymentChart)bar('lmsCourseDirectionPayments',d.courseDirectionPaymentChart.categories,d.courseDirectionPaymentChart.series,true,340);if(hasCampusTotals)donut('lmsCampusTotals',campusCards.map(x=>x.label),campusCards.map(x=>x.value),['#3466f6','#17b877'])}
async function load(){clearCharts();applyAppearance();applyI18n();updateProfile();if(!ensureAuthenticated()){renderAuthGate();return}setAuthMode(true);if(view==='settings'){renderSettings();return}try{if(view==='home'){document.getElementById('content').innerHTML=skeleton();const d=await loadHomeData();await renderHome(d);lucide.createIcons();return}if(view==='pbx'){document.getElementById('content').innerHTML=skeleton();const d=await loadPbxData();await renderPbx(d);lucide.createIcons();return}if(view==='crm'){document.getElementById('content').innerHTML=skeleton();const d=await loadCrmData();await renderCrm(d);lucide.createIcons();return}if(view==='lms'){const cached=readLmsCache();if(cached){lmsCacheData=cached;lmsCacheFetchedAt=Date.parse(cached.fetchedAt||'')||Date.now();await renderLms(buildLmsDashboardData(cached,lmsFilterState()));lucide.createIcons();fetchLmsDashboardSummary(true).then(source=>{if(view!=='lms'||!ensureAuthenticated())return;renderLms(buildLmsDashboardData(source,lmsFilterState())).then(()=>lucide.createIcons())}).catch(error=>console.error('LMS background refresh failed',error));return}document.getElementById('content').innerHTML=skeleton();const d=await loadLmsData();await renderLms(d);lucide.createIcons();return}}catch(e){console.error('Dashboard load error',e);document.getElementById('content').innerHTML=`<div class="notice"><b>Xato:</b> ${e.message||e}<div class="smallnote">Supabase summary viewlari, sessiya va query ruxsatlarini tekshiring.</div></div>`}}
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.getElementById('pageTitle').textContent=t(view);document.getElementById('pageSub').textContent=t('sub');document.getElementById('dateBtnText').textContent=filter.preset==='range'?`${filter.start} → ${filter.end}`:t('range');document.getElementById('themeBtn').innerHTML=`<i data-lucide="${theme==='dark'?'sun':'moon'}"></i>`;document.querySelectorAll('#quickBtns button').forEach(b=>b.classList.toggle('active',filter.preset===b.dataset.preset));syncLmsFilterControls();lucide.createIcons()}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;load()});
document.getElementById('quickBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter={preset:b.dataset.preset};cache.clear();load()};
document.getElementById('dateBtn').onclick=()=>document.getElementById('datePop').classList.toggle('open');
document.getElementById('dateCancel').onclick=()=>document.getElementById('datePop').classList.remove('open');
document.getElementById('dateApply').onclick=()=>{const s=document.getElementById('startDate').value||todayTz(),e=document.getElementById('endDate').value||s;filter={preset:'range',start:s,end:e<s?s:e};document.getElementById('datePop').classList.remove('open');cache.clear();load()};
document.getElementById('lang').onchange=e=>{lang=e.target.value;localStorage.nexus_lang=lang;load()};
document.getElementById('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.nexus_theme=theme;document.documentElement.dataset.theme=theme;load()};
document.getElementById('lmsCampusFilter').onchange=e=>{lmsUiFilter.campus=e.target.value;localStorage.nexus_lms_campus=lmsUiFilter.campus;if(view==='lms')load()};
document.getElementById('lmsStudyFilter').onchange=e=>{lmsUiFilter.studyForm=e.target.value;localStorage.nexus_lms_study=lmsUiFilter.studyForm;if(view==='lms')load()};
document.getElementById('logoutBtn').onclick=()=>signOut();
document.getElementById('content').onclick=e=>{const colorBtn=e.target.closest('[data-color-theme]'),fontBtn=e.target.closest('[data-font-theme]');if(colorBtn){uiPrefs.color=colorBtn.dataset.colorTheme;localStorage.nexus_color_theme=uiPrefs.color;applyAppearance();renderSettings();return}if(fontBtn){uiPrefs.font=fontBtn.dataset.fontTheme;localStorage.nexus_font_theme=uiPrefs.font;applyAppearance();renderSettings()}}
document.getElementById('content').onsubmit=async e=>{if(e.target.id!=='authForm')return;e.preventDefault();const submit=document.getElementById('authSubmit'),email=document.getElementById('authEmail')?.value?.trim(),password=document.getElementById('authPassword')?.value||'';if(!email||!password){setAuthStatus('Email va parolni kiriting.','error');return}submit.disabled=true;setAuthStatus('Kirish tekshirilmoqda...');try{await signInWithPassword(email,password);setAuthStatus('');await load()}catch(err){setAuthStatus(err?.message||'Kirish amalga oshmadi.','error')}finally{submit.disabled=false}}
['copy','cut','contextmenu','dragstart','selectstart'].forEach(evt=>document.addEventListener(evt,e=>{const allowField=e.target.closest('input, textarea');if(allowField&&evt==='selectstart')return;e.preventDefault()}));
document.addEventListener('keydown',e=>{const key=String(e.key).toLowerCase(),allowField=e.target.closest('input, textarea');if(allowField)return;if(key==='f12'||((e.ctrlKey||e.metaKey)&&['a','c','x','s','u','p'].includes(key))||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c'].includes(key)))e.preventDefault()});
applyAppearance();
const td=todayTz();document.getElementById('startDate').value=td;document.getElementById('endDate').value=td;applyI18n();updateProfile();client().auth.onAuthStateChange((_event,session)=>{currentSession=session||null;cache.clear();if(_event==='SIGNED_OUT')clearLmsCache();updateProfile();if(authBooted)load()});restoreSession().catch(()=>null).finally(()=>{authBooted=true;const cached=readLmsCache();if(cached){lmsCacheData=cached;lmsCacheFetchedAt=Date.parse(cached.fetchedAt||'')||0}fetchLmsDashboardSummary().catch(error=>console.error('LMS cache warmup failed',error));load()});
</script>
</body>
